apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  labels:
    app: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      initContainers:
        - name: init-notebooks
          image: busybox
          command: ["sh", "-c", "mkdir -p /data/notebooks && chmod -R 777 /data"]
          volumeMounts:
            - name: jupyter-data
              mountPath: /data

      containers:
        - name: jupyter
          image: my-jupyter
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          args:
            - jupyter
            - lab
            - --ip=0.0.0.0
            - --port=8888
            - --no-browser
            - --allow-root
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jupyter-secret
                  key: JUPYTER_TOKEN
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
          volumeMounts:
          - name: jupyter-data
            mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /lab
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /lab
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
      - name: jupyter-data
        persistentVolumeClaim:
          claimName: jupyter-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
spec:
  type: NodePort
  selector:
    app: jupyter
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30088

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
